name: lock

# Regenerates requirements-dev.txt with hashes for every platform. Run it by
# hand after editing requirements-dev.in; it uploads the result as an
# artifact for review instead of committing it.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Compile
        run: >
          uv pip compile requirements-dev.in --universal --python-version 3.11
          --generate-hashes --no-header --output-file requirements-dev.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-dev
          path: requirements-dev.txt
