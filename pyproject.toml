[project]
name = "herdr-auth-picker"
version = "1.3.0"
description = "Switch Claude Code and Codex logins in herdr, without losing them."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "RET", "ARG", "BLE", "PT",
    "S",  # flake8-bandit
]
ignore = [
    "S603",     # every subprocess call goes through auth_picker.proc, which takes argv lists only
    "PLR0913",  # explicit parameters are clearer than option bags here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]  # fake tokens are the point

[tool.mypy]
python_version = "3.11"
strict = true
files = ["auth_picker", "main.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
